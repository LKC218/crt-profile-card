<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="LKC218 CRT profile card">
  <title>LKC218 — CRT profile card</title>
  <defs>
    <!-- phosphor glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- scanline overlay -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <!-- soft vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- typing clips (one per line) -->
    <clipPath id="c1">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="0.6s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="1.0s" begin="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="0.45s" begin="2.0s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c4">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="1.15s" begin="2.55s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c5">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="0.95s" begin="3.85s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c6">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="0.45s" begin="4.95s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c7">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="1.15s" begin="5.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c8">
      <rect x="0" y="0" width="0" height="390">
        <animate attributeName="width" from="0" to="920" dur="1.0s" begin="6.8s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- CRT bezel gradient -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f2a"/>
      <stop offset="100%" stop-color="#141814"/>
    </linearGradient>
  </defs>

  <!-- outer bezel -->
  <rect width="960" height="390" rx="18" fill="url(#bezel)"/>
  <rect x="10" y="10" width="940" height="370" rx="12" fill="#041208"/>

  <!-- screen glow bed -->
  <rect x="10" y="10" width="940" height="370" rx="12" fill="#062010" fill-opacity="0.35"/>

  <!-- top chrome bar -->
  <g fill="#3dff7a" fill-opacity="0.75" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="14">
    <text x="32" y="42">◆ CRT://lkc218.profile</text>
    <text x="820" y="42">● ONLINE</text>
  </g>
  <line x1="28" y1="54" x2="932" y2="54" stroke="#1f6b3a" stroke-width="1"/>

  <!-- typed lines -->
  <g filter="url(#glow)" font-family="ui-monospace, Consolas, 'Courier New', monospace">
    <!-- whoami prompt -->
    <g clip-path="url(#c1)">
      <text x="32" y="88" fill="#3dff7a" font-size="20" font-weight="600">
        &gt; whoami
      </text>
    </g>

    <!-- ID -->
    <g clip-path="url(#c2)">
      <text x="32" y="138" fill="#7dffb0" font-size="46" font-weight="700" letter-spacing="4">
        LKC218
      </text>
    </g>

    <!-- hello prompt -->
    <g clip-path="url(#c3)">
      <text x="32" y="172" fill="#3dff7a" font-size="18" font-weight="600">
        &gt; hello
      </text>
    </g>

    <!-- playful welcome EN -->
    <g clip-path="url(#c4)">
      <text x="32" y="202" fill="#3dff7a" font-size="18">
        Welcome, traveler. Coffee not detected.
      </text>
    </g>

    <!-- playful welcome ZH -->
    <g clip-path="url(#c5)">
      <text x="32" y="230" fill="#3dff7a" font-size="17">
        欢迎，旅人。未检测到咖啡。
      </text>
    </g>

    <!-- motto prompt -->
    <g clip-path="url(#c6)">
      <text x="32" y="264" fill="#3dff7a" font-size="18" font-weight="600">
        &gt; motto
      </text>
    </g>

    <!-- quote EN -->
    <g clip-path="url(#c7)">
      <text x="32" y="294" fill="#b8ffc9" font-size="18" font-style="italic">
        &quot;Stay hungry, stay foolish.&quot;
      </text>
    </g>

    <!-- quote ZH -->
    <g clip-path="url(#c8)">
      <text x="32" y="322" fill="#3dff7a" font-size="17">
        求知若饥，虚心若愚。 — Jobs
      </text>
    </g>
  </g>

  <!-- blinking cursor after type completes -->
  <g fill="#3dff7a">
    <rect x="290" y="306" width="11" height="20" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="7.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanlines -->
  <rect x="10" y="10" width="940" height="370" rx="12" fill="url(#scan)" pointer-events="none"/>

  <!-- vignette -->
  <rect x="10" y="10" width="940" height="370" rx="12" fill="url(#vig)" pointer-events="none"/>

  <!-- subtle glass reflection -->
  <path d="M30 24 C 120 8, 260 8, 400 24 L 380 40 C 250 26, 140 26, 50 40 Z" fill="#ffffff" fill-opacity="0.03"/>

  <!-- bottom status -->
  <g fill="#1f8a42" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12">
    <text x="32" y="374">ready · green-scanlines · no-js svg</text>
    <text x="800" y="374">v1.2.0</text>
  </g>
</svg>
