<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="LKC218 CRT profile card">
  <title>LKC218 — CRT profile card</title>
  <defs>
    <!-- phosphor glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- scanline overlay -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.18"/>
    </pattern>

    <!-- soft vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- typing clips (one per line) -->
    <clipPath id="c1">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="920" dur="0.7s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="920" dur="1.1s" begin="1.0s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="920" dur="0.7s" begin="2.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="c4">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="920" dur="1.6s" begin="3.1s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- CRT bezel gradient -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f2a"/>
      <stop offset="100%" stop-color="#141814"/>
    </linearGradient>
  </defs>

  <!-- outer bezel -->
  <rect width="960" height="300" rx="18" fill="url(#bezel)"/>
  <rect x="10" y="10" width="940" height="280" rx="12" fill="#041208"/>

  <!-- screen glow bed -->
  <rect x="10" y="10" width="940" height="280" rx="12" fill="#062010" fill-opacity="0.35"/>

  <!-- top chrome bar -->
  <g fill="#3dff7a" fill-opacity="0.75" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="14">
    <text x="32" y="42">◆ CRT://lkc218.profile</text>
    <text x="820" y="42">● ONLINE</text>
  </g>
  <line x1="28" y1="54" x2="932" y2="54" stroke="#1f6b3a" stroke-width="1"/>

  <!-- typed lines -->
  <g filter="url(#glow)" font-family="ui-monospace, Consolas, 'Courier New', monospace">
    <!-- line 1: prompt -->
    <g clip-path="url(#c1)">
      <text x="32" y="96" fill="#3dff7a" font-size="22" font-weight="600">
        &gt; whoami
      </text>
    </g>

    <!-- line 2: name (large) -->
    <g clip-path="url(#c2)">
      <text x="32" y="152" fill="#7dffb0" font-size="48" font-weight="700" letter-spacing="4">
        LKC218
      </text>
    </g>

    <!-- line 3: prompt -->
    <g clip-path="url(#c3)">
      <text x="32" y="200" fill="#3dff7a" font-size="22" font-weight="600">
        &gt; slogan
      </text>
    </g>

    <!-- line 4: slogan -->
    <g clip-path="url(#c4)">
      <text x="32" y="238" fill="#3dff7a" font-size="20">
        Building local-first tools. · 做本地优先的小工具
      </text>
    </g>
  </g>

  <!-- blinking cursor after type completes -->
  <g fill="#3dff7a">
    <rect x="560" y="222" width="12" height="22" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanlines -->
  <rect x="10" y="10" width="940" height="280" rx="12" fill="url(#scan)" pointer-events="none"/>

  <!-- vignette -->
  <rect x="10" y="10" width="940" height="280" rx="12" fill="url(#vig)" pointer-events="none"/>

  <!-- subtle glass reflection -->
  <path d="M30 24 C 120 8, 260 8, 400 24 L 380 40 C 250 26, 140 26, 50 40 Z" fill="#ffffff" fill-opacity="0.03"/>

  <!-- bottom status -->
  <g fill="#1f8a42" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12">
    <text x="32" y="284">ready · green-scanlines · no-js svg</text>
    <text x="800" y="284">v1.0.0</text>
  </g>
</svg>
